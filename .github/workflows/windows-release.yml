name: Windows-Paket

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Windows-Installer und portable EXE bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmartSeacrch ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/SmartSeacrch-Setup-*.exe
            release/SmartSeacrch-Portable-*.exe
            release/SmartSeacrch-*-win.zip
          body: |
            Windows-Programm, ohne Server. Auf dem eigenen Rechner starten.

            - **SmartSeacrch-Setup-0.1.0.exe** — Installer (Startmenü und Desktop-Verknüpfung)
            - **SmartSeacrch-Portable-0.1.0.exe** — eine Datei kopieren und doppelklicken

            Bei der Windows-Warnung: «Weitere Informationen» → «Trotzdem ausführen».
