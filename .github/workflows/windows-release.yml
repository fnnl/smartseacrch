name: Windows-Paket

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps

      - name: Windows-Installer und portable EXE bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Ausgabe bei Fehler
        if: failure()
        run: Get-ChildItem -Recurse release -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmartSeacrch ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/SmartSeacrch-Setup-*.exe
            release/SmartSeacrch-Portable-*.exe
          body: |
            Windows-Programm, ohne Server. Auf dem eigenen Rechner starten.

            - **SmartSeacrch-Setup-*.exe** — Installer (Startmenü und Desktop-Verknüpfung)
            - **SmartSeacrch-Portable-*.exe** — eine Datei kopieren und doppelklicken

            Bei der Windows-Warnung: «Weitere Informationen» → «Trotzdem ausführen».
